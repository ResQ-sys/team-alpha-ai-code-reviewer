[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "team-alpha-ai-code-reviewer"
version = "1.0.0"
description = "Multi-agent AI code reviewer and secure development agent (LangGraph pipeline, static analysis, RAG, autonomous fix repair)."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Team Alpha" }]
keywords = ["code-review", "security", "langgraph", "static-analysis", "rag", "semgrep", "agents"]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Security",
    "License :: OSI Approved :: MIT License",
]

# Mirrors requirements.txt — keep the two in sync.
dependencies = [
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "anthropic>=0.34.0",
    "openai>=1.40.0",
    "semgrep>=1.78.0",
    "sentence-transformers>=3.0.0",
    "faiss-cpu>=1.8.0",
    "scikit-learn>=1.4.0",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "streamlit>=1.37.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-dotenv>=1.0.0",
    "rich>=13.7.0",
    "requests>=2.32.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "ruff>=0.5.0",
]

[project.urls]
Homepage = "https://github.com/team-alpha/team-alpha-ai-code-reviewer"
Repository = "https://github.com/team-alpha/team-alpha-ai-code-reviewer"

[project.scripts]
code-reviewer = "main:main"

[tool.setuptools]
# Flat layout: a mix of top-level modules and packages living at the repo root.
py-modules = ["main", "graph", "config", "app"]

[tool.setuptools.packages.find]
# Namespace-aware discovery: some existing packages (rag, utils) intentionally
# ship without an __init__.py, so the PEP 420 finder is required to include them.
namespaces = true
where = ["."]
include = [
    "agents*",
    "utils*",
    "rag*",
    "observability*",
    "persistence*",
    "secure_dev*",
    "evaluation*",
    "server*",
]
exclude = ["tests*", "sample_repo*", "rules*", "*__pycache__*"]

[tool.setuptools.package-data]
rag = ["*.json"]
evaluation = ["fixtures/**/*"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv", "sample_repo", "__pycache__"]

[tool.ruff.lint]
# Sensible defaults: pyflakes (F), pycodestyle (E/W), isort (I), bugbear (B),
# pyupgrade (UP). Kept pragmatic for an existing codebase.
select = ["E", "F", "W", "I", "B", "UP"]
ignore = [
    "E501",  # line length is enforced by the formatter, not the linter
    "B008",  # FastAPI uses function calls (Depends()) in argument defaults
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
"__init__.py" = ["F401"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
omit = ["tests/*", "sample_repo/*", ".venv/*"]
